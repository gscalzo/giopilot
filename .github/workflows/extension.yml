name: Extension Quality Gates

on:
  push:
    branches: [main]
    paths: ["extension/**"]
  pull_request:
    paths: ["extension/**"]

defaults:
  run:
    working-directory: extension

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Quality gates
        run: npm run check
      - name: Build
        run: npm run build
